name: Publish website

# Publishes the PRE-BUILT ./docs folder to GitHub Pages.
#
# The site (with the stored notebook outputs and the compressed slides) is built
# locally by build.sh; this workflow only uploads ./docs and deploys it.
#
# Requires: Settings -> Pages -> Source = "GitHub Actions".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload pre-built ./docs (figures already rendered locally)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
